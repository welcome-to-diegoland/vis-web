<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reviw.</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <!-- Login Overlay -->
  <div id="loginOverlay" class="login-overlay">
    <div class="login-container">
      <!-- Logo fuera del recuadro -->
      <div class="login-logo">
        <img src="assets/reviw-logo.svg" alt="Reviw Logo" class="login-logo-img">
      </div>
      
      <!-- Título fuera del recuadro -->
      
      <div class="login-form">
        <!-- Formulario -->
        <div class="login-inputs">
          <input type="text" id="loginUsername" class="login-input" placeholder="usuario...">
          <input type="password" id="loginPassword" class="login-input" placeholder="contraseña...">
          <button id="loginBtn" class="login-button">entrar</button>
        </div>
        
        <!-- Error Message -->
        <div id="loginError" class="login-error" style="display:none;"></div>
      </div>
    </div>
  </div>

  <!-- Main Application (initially hidden) -->
  <div id="mainApp" style="display:none;">
  
  <header class="main-header">
    <div class="header-content d-flex justify-content-between align-items-center px-3 py-2">
      <div class="header-column left-column d-flex gap-2 align-items-center">
        <!-- Logo -->
        <div class="header-logo">
          <img src="assets/reviw-logo.svg" alt="Reviw Logo" class="logo-img">
        </div>
        
        <!-- Usuario logueado -->
        <div class="user-info d-flex align-items-center">
          <i class="fa-solid fa-user user-icon me-2"></i>
          <span id="currentUserName" class="user-name-text">Usuario</span>
          <span id="currentUserGroup" class="user-group-text ms-2"></span>
        </div>
      </div>
      <div class="header-column center-column">
        <!-- Columna central vacía ahora -->
      </div>
      <div class="header-column right-column">
        <div class="header-buttons d-flex gap-2">
          <!-- Botón Toggle Vista -->
          <button id="cleanViewToggle" class="btn btn-secondary btn-compact" onclick="toggleCleanView()">
            <i class="fa-solid fa-table-list" style="margin-right: 6px;"></i>Información
          </button>
          <!-- Puedes agregar más botones aquí en el futuro -->
        </div>
      </div>
    </div>
  </header>
  <main class="main-container">
    <section class="left-section" id="leftSection">
      <article class="box" id="box1">
        <div id="tree"></div>
      </article>
      <div class="horizontal-divider" id="horizontalDivider"></div>
      <article class="box" id="box3">
        <div id="box3-content"></div>
      </article>
    </section>
    <div class="vertical-divider" id="verticalDivider"></div>
    <section class="right-section" id="rightSection">
      <article class="box" id="box4">
        <div id="box4-content"></div>
      </article>
    </section>
  </main>

  <!-- Modal de Filtros de Inventario -->
  <div id="inventoryFiltersModal" class="inventory-filters-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Filtros de Inventario</h3>
        <button class="modal-close-btn" onclick="closeInventoryFiltersModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="filter-group">
          <label class="filter-label" for="filterAnalista">Analista</label>
          <select id="filterAnalista" class="filter-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterDisenador">Diseñador</label>
          <select id="filterDisenador" class="filter-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterStatus">Status</label>
          <select id="filterStatus" class="filter-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterTipo">Tipo</label>
          <select id="filterTipo" class="filter-select">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="clearInventoryFilters()">
          <i class="fas fa-times"></i> Limpiar
        </button>
        <button class="btn btn-primary" onclick="applyInventoryFilters()">
          <i class="fas fa-filter"></i> Aplicar Filtros
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Asignación de Diseñadoras -->
  <div id="assignDesignerModal" class="assignment-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Asignar Comentarios</h3>
        <button class="modal-close-btn" onclick="closeAssignDesignerModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="assignment-summary">
          <div class="summary-stats">
            <span class="unassigned-count">Comentarios sin asignar: <strong id="unassignedCount">0</strong></span>
          </div>
        </div>
        
        <div class="designers-list">
          <div id="designersList">
            <!-- Se llena dinámicamente -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="distributeEqually()">
          <i class="fas fa-plus-circle"></i> Repartir
        </button>
        <button class="btn btn-secondary" onclick="closeAssignDesignerModal()">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button class="btn btn-success" onclick="applyDesignerAssignments()">
          <i class="fas fa-check"></i> Aplicar
        </button>
      </div>
    </div>
  </div>
  
  </div> <!-- End of mainApp -->

  <script src="script.js"></script>
</body>
</html>
