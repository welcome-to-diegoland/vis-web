<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Página Base</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header class="main-header">
    <div class="header-content d-flex justify-content-between align-items-center px-3 py-2">
      <div class="header-column left-column d-flex gap-2 align-items-center">
        <!-- Dropdown de usuario (solo icono + select) -->
        <div class="user-selector d-flex align-items-center">
          <i class="fa-solid fa-user user-icon me-1"></i>
          <select id="userSelect" class="form-select user-select">
            <option value="usuario">Usuario</option>
            <option value="Sandra">Sandra (Analistas)</option>
            <option value="Victor">Victor (Analistas)</option>
            <option value="Ximena">Ximena (Analistas)</option>
            <option value="Carlos">Carlos (Analistas)</option>
            <option value="Kalem">Kalem (Analistas)</option>
            <option value="Veronica">Verónica (Diseño)</option>
            <option value="Rossana">Rossana (Diseño)</option>
            <option value="Carla">Carla (Diseño)</option>
            <option value="Gabriela">Gabriela (Diseño)</option>
            <option value="Thanya">Thanya (Diseño)</option>
            <option value="Grecia">Grecia (Diseño)</option>
            <option value="Cinthya">Cinthya (Diseño)</option>
          </select>
        </div>
        
        <!-- Botón Cargar Excel -->
        <input type="file" id="combinedFile" accept=".xlsx,.xls" style="display:none;">
        <button id="loadExcelBtn" class="btn btn-primary btn-compact" onclick="loadFromSharePoint()">
          <i class="fa-solid fa-cloud"></i> SharePoint
        </button>
        <button id="loadLocalBtn" class="btn btn-primary btn-compact" onclick="document.getElementById('combinedFile').click()" title="Cargar archivo local">
          <i class="fa-solid fa-folder-open"></i> Local
        </button>
      </div>
      <div class="header-column center-column">
        <!-- Columna central vacía ahora -->
      </div>
      <div class="header-column right-column">
        <div class="header-buttons d-flex gap-2">
          <!-- Botón Toggle Vista -->
          <button id="cleanViewToggle" class="btn btn-secondary btn-compact" onclick="toggleCleanView()">
            <i class="fa-solid fa-eye"></i> Visualizador
          </button>
          <button id="saveChangesBtn" class="btn btn-success">
            <i class="fa-solid fa-save"></i> Guardar cambios
          </button>
          <button id="exportBtn" class="btn btn-warning">
            <i class="bi bi-box-arrow-up"></i> Exportar
          </button>
          <!-- Puedes agregar más botones aquí en el futuro -->
        </div>
      </div>
    </div>
  </header>
  <main class="main-container">
    <section class="left-section" id="leftSection">
      <article class="box" id="box1">
        <div id="tree"></div>
      </article>
      <div class="horizontal-divider" id="horizontalDivider"></div>
      <article class="box" id="box3">
        <div id="box3-content"></div>
      </article>
    </section>
    <div class="vertical-divider" id="verticalDivider"></div>
    <section class="right-section" id="rightSection">
      <article class="box" id="box4">
        <div id="box4-content"></div>
      </article>
    </section>
  </main>

  <!-- Modal de Filtros de Inventario -->
  <div id="inventoryFiltersModal" class="inventory-filters-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Filtros de Inventario</h3>
        <button class="modal-close-btn" onclick="closeInventoryFiltersModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="filter-group">
          <label class="filter-label" for="filterAnalista">Analista</label>
          <select id="filterAnalista" class="filter-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterDisenador">Diseñador</label>
          <select id="filterDisenador" class="filter-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterStatus">Status</label>
          <select id="filterStatus" class="filter-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label" for="filterTipo">Tipo</label>
          <select id="filterTipo" class="filter-select">
            <option value="">Todos</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="clearInventoryFilters()">
          <i class="fas fa-times"></i> Limpiar
        </button>
        <button class="btn btn-primary" onclick="applyInventoryFilters()">
          <i class="fas fa-filter"></i> Aplicar Filtros
        </button>
      </div>
    </div>
  </div>

  <!-- Modal de Asignación de Diseñadoras -->
  <div id="assignDesignerModal" class="assignment-modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3 class="modal-title">Asignar Diseñadoras</h3>
        <button class="modal-close-btn" onclick="closeAssignDesignerModal()">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="assignment-summary">
          <div class="summary-stats">
            <span class="unassigned-count">Comentarios sin diseñadora: <strong id="unassignedCount">0</strong></span>
          </div>
        </div>
        
        <div class="designers-list">
          <h4>Diseñadoras Disponibles</h4>
          <div id="designersList">
            <!-- Se llena dinámicamente -->
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="distributeEqually()">
          <i class="fas fa-balance-scale"></i> Repartir
        </button>
        <button class="btn btn-warning" onclick="distributeRemaining()">
          <i class="fas fa-plus-circle"></i> Restantes
        </button>
        <button class="btn btn-secondary" onclick="closeAssignDesignerModal()">
          <i class="fas fa-times"></i> Cancelar
        </button>
        <button class="btn btn-success" onclick="applyDesignerAssignments()">
          <i class="fas fa-check"></i> Aplicar Asignaciones
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
