<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi Página Base</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header class="main-header">
    <div class="header-content d-flex justify-content-between align-items-center px-3 py-2">
      <div class="header-column left-column d-flex gap-2 align-items-center">
        <!-- Dropdown de usuario (solo icono + select) -->
        <div class="user-selector d-flex align-items-center">
          <i class="fa-solid fa-user user-icon me-1"></i>
          <select id="userSelect" class="form-select user-select">
            <option value="usuario">Usuario</option>
            <option value="sandra">Sandra (Analistas)</option>
            <option value="rossana">Rossana (Diseño)</option>
          </select>
        </div>
        
        <!-- Botón Cargar Excel -->
        <input type="file" id="combinedFile" accept=".xlsx,.xls" style="display:none;">
        <button id="loadExcelBtn" class="btn btn-primary" onclick="document.getElementById('combinedFile').click()">
          <i class="fa-solid fa-file-excel"></i> Cargar Excel
        </button>
      </div>
      <div class="header-column center-column">
        <!-- Columna central vacía ahora -->
      </div>
      <div class="header-column right-column">
        <div class="header-buttons d-flex gap-2">
          <button id="saveChangesBtn" class="btn btn-success">
            <i class="fa-solid fa-save"></i> Guardar cambios
          </button>
          <button id="exportBtn" class="btn btn-warning">
            <i class="bi bi-box-arrow-up"></i> Exportar
          </button>
          <!-- Puedes agregar más botones aquí en el futuro -->
        </div>
      </div>
    </div>
  </header>
  <main class="main-container">
    <section class="left-section" id="leftSection">
      <article class="box" id="box1">
        <div id="tree"></div>
      </article>
      <div class="horizontal-divider" id="horizontalDivider"></div>
      <article class="box" id="box3">
        <div id="box3-content"></div>
      </article>
    </section>
    <div class="vertical-divider" id="verticalDivider"></div>
    <section class="right-section" id="rightSection">
      <article class="box" id="box4">
        <div id="box4-content"></div>
      </article>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
